services:
  - type: web
    name: ai-casa-demo
    runtime: python
    buildCommand: pip install -r requirements.txt && python setup_models.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    disk:
      name: models-disk
      mountPath: /opt/render/project/src/models
      sizeGB: 5
